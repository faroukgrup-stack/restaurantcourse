<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>اختبار الدورة + الشهادة | فاروق للتدريب</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,600&family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    /* ===== الأساسيات ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', sans-serif;
      background: #0b0d14;
      color: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }
    .container {
      background: #141821;
      border: 1px solid rgba(184, 134, 11, 0.2);
      border-radius: 24px;
      padding: 30px;
      max-width: 950px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(184, 134, 11, 0.15);
      margin: 20px auto;
    }
    .hidden { display: none !important; }

    /* ===== رأس الصفحة ===== */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 15px;
      margin-bottom: 25px;
    }
    .header h1 {
      color: #d4af37;
      font-weight: 900;
      font-size: 1.7rem;
    }
    .header h1 i { margin-left: 10px; }
    .header .badge {
      background: rgba(184, 134, 11, 0.2);
      padding: 5px 15px;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #d4af37;
      border: 1px solid rgba(184, 134, 11, 0.3);
    }

    /* ===== منطقة الاختبار ===== */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    .quiz-header .progress-text { color: #a0aec0; font-weight: 700; }
    .progress-bar-container {
      height: 6px; background: #2a2f3a;
      border-radius: 10px; margin-bottom: 25px; overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #b8860b, #d4af37);
      border-radius: 10px;
      transition: width 0.4s ease;
      width: 0%;
    }
    .question-text { font-size: 1.2rem; font-weight: 700; margin-bottom: 20px; line-height: 1.7; }
    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
    .option {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 20px;
      cursor: pointer;
      transition: 0.3s;
      display: flex; align-items: center; gap: 12px;
    }
    .option:hover { background: rgba(184, 134, 11, 0.1); border-color: #b8860b; }
    .option.selected { background: rgba(184, 134, 11, 0.2); border-color: #d4af37; }
    .option input[type="radio"] { accent-color: #d4af37; width: 18px; height: 18px; cursor: pointer; }
    .option label { flex: 1; cursor: pointer; font-size: 1rem; }
    .nav-buttons { display: flex; justify-content: space-between; gap: 15px; }
    .btn {
      padding: 12px 28px;
      border: none;
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-primary { background: linear-gradient(135deg, #b8860b, #d4af37); color: #0b0d14; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(184, 134, 11, 0.4); }
    .btn-secondary { background: rgba(255,255,255,0.05); color: #f0f2f5; border: 1px solid rgba(255,255,255,0.1); }
    .btn-secondary:hover { background: rgba(255,255,255,0.1); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; }
    .btn-success { background: #2ecc71; color: #0b0d14; }
    .btn-success:hover { background: #27ae60; transform: translateY(-2px); }
    .btn-warning { background: #e67e22; color: #fff; }
    .btn-warning:hover { background: #d35400; }

    /* ===== نتيجة الاختبار ===== */
    .result-box { text-align: center; padding: 30px 0; }
    .result-box .score { font-size: 3rem; font-weight: 900; color: #d4af37; }
    .result-box .message { font-size: 1.2rem; margin: 15px 0; }
    .result-box .pass { color: #2ecc71; }
    .result-box .fail { color: #e74c3c; }

    /* ===== نافذة إدخال الأسماء (Modal) ===== */
    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
      display: flex; justify-content: center; align-items: center; z-index: 9999;
    }
    .modal-content {
      background: #1a1f2b;
      border: 1px solid rgba(184, 134, 11, 0.3);
      border-radius: 24px;
      padding: 40px;
      max-width: 540px;
      width: 90%;
      text-align: center;
    }
    .modal-content h2 { color: #d4af37; margin-bottom: 10px; }
    .modal-content p { color: #a0aec0; margin-bottom: 20px; }
    .modal-content input {
      width: 100%;
      padding: 14px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      color: #fff;
      font-size: 1.05rem;
      text-align: center;
      font-family: 'Tajawal', sans-serif;
      margin-bottom: 12px;
    }
    .modal-content input:focus { outline: none; border-color: #d4af37; box-shadow: 0 0 0 3px rgba(184, 134, 11, 0.2); }
    .modal-content .btn { width: 100%; margin-top: 8px; }
    .modal-content .error-msg { color: #e74c3c; margin-top: 10px; font-weight: 700; }
    .name-lbl { display: block; text-align: right; color: #d4af37; font-size: .9rem; margin: 4px 12px; font-weight: 700; }

    /* ================================================================ */
    /* ============ الشهادة الجديدة (A4 Landscape) ============ */
    /* ================================================================ */
    #certificateArea { display: flex; flex-direction: column; align-items: center; }
    .certificate-wrapper {
      display: flex; flex-direction: column; align-items: center;
      gap: 40px; width: 100%;
    }
    .lang-label {
      font-family: 'Cinzel', serif; font-size: 12px;
      color: #d4af37; letter-spacing: 3px; text-align: center;
      margin-bottom: -22px;
    }
    .cert {
      width: 297mm; height: 210mm;
      position: relative; overflow: hidden; flex-shrink: 0;
      box-shadow: 0 14px 40px rgba(0,0,0,.35);
      color: #1a1410;
      background:
        radial-gradient(circle at 12% 12%, rgba(212,175,55,.10), transparent 38%),
        radial-gradient(circle at 88% 88%, rgba(212,175,55,.10), transparent 38%),
        radial-gradient(circle at 88% 12%, rgba(201,162,39,.06), transparent 40%),
        radial-gradient(circle at 12% 88%, rgba(201,162,39,.06), transparent 40%),
        linear-gradient(135deg,#fdf7e9 0%,#fbf1da 45%,#f8ecd0 100%);
    }
    /* الإطار الكامل */
    .frame-outer {
      position: absolute; top: 6mm; left: 6mm; right: 6mm; bottom: 6mm;
      border: 2.5px solid #c9a227;
      box-shadow: inset 0 0 0 1px rgba(201,162,39,.35);
      pointer-events: none; z-index: 3;
    }
    .frame-mid {
      position: absolute; top: 9mm; left: 9mm; right: 9mm; bottom: 9mm;
      border: .8px solid #c9a227; opacity: .75;
      pointer-events: none; z-index: 3;
    }
    .frame-inner {
      position: absolute; top: 11.5mm; left: 11.5mm; right: 11.5mm; bottom: 11.5mm;
      border: .5px solid rgba(201,162,39,.45);
      pointer-events: none; z-index: 3;
    }
    /* زخارف الأركان */
    .crn {
      position: absolute; width: 11mm; height: 11mm; z-index: 4; pointer-events: none;
    }
    .crn::before, .crn::after {
      content: ''; position: absolute; top: 50%; left: 50%;
      background: #c9a227;
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .crn::before { width: 4mm; height: 4mm; }
    .crn::after { width: 1.8mm; height: 1.8mm; background: #fdf7e9; }
    .crn.tl { top: 5.2mm; left: 5.2mm; }
    .crn.tr { top: 5.2mm; right: 5.2mm; }
    .crn.bl { bottom: 5.2mm; left: 5.2mm; }
    .crn.br { bottom: 5.2mm; right: 5.2mm; }
    /* علامة مائية */
    .wm {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) rotate(-8deg);
      font-family: 'Cinzel', serif; font-size: 96px; font-weight: 700;
      color: rgba(184,134,11,.05);
      letter-spacing: 10px; white-space: nowrap;
      pointer-events: none; z-index: 0;
    }
    /* الميدالية */
    .medal { position: absolute; top: 17mm; left: 17mm; width: 58px; height: 78px; z-index: 5; }
    .medal svg { width: 100%; height: 100%; }
    /* جسم الشهادة */
    .body {
      position: relative; z-index: 4;
      height: 100%;
      display: grid;
      grid-template-rows:
        28mm   /* شعار */
        24mm   /* العنوان */
        10mm   /* presented */
        24mm   /* الاسم */
        9mm    /* for */
        15mm   /* الدورة */
        24mm   /* الوصف */
        1fr
        30mm;  /* الفوتر */
      padding: 16mm 22mm 14mm;
      text-align: center;
    }
    .r-logo { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 1mm; }
    .logo { width: 120px; max-height: 52px; object-fit: contain; }
    .logo-fb { display: none; font-family: 'Cinzel', serif; font-size: 17px; color: #8b6914; font-weight: 700; letter-spacing: 2px; }
    .org { font-family: 'Cinzel', serif; font-size: 11px; color: #7a6a55; letter-spacing: 3px; margin-top: 2mm; text-transform: uppercase; }
    .r-title { display: flex; align-items: center; justify-content: center; }
    .ctitle { font-family: 'Great Vibes', cursive; font-size: 52px; color: #b8860b; line-height: 1; font-weight: 400; }
    .ctitle.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 40px; font-weight: 700; }
    .r-pres { display: flex; align-items: center; justify-content: center; }
    .pres { font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 4px; color: #6b5a45; text-transform: uppercase; }
    .pres.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 14px; letter-spacing: 1px; text-transform: none; }
    .r-name { display: flex; align-items: center; justify-content: center; }
    .tname {
      font-family: 'Playfair Display', serif; font-weight: 700;
      font-size: 52px; color: #1a1410; letter-spacing: 1.5px;
      line-height: 1.1; padding-bottom: 2mm;
      border-bottom: 1.2px solid rgba(201,162,39,.55);
      display: inline-block;
    }
    .tname.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 48px; }
    .r-for { display: flex; align-items: center; justify-content: center; }
    .for { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 3px; color: #6b5a45; text-transform: uppercase; }
    .for.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 14px; letter-spacing: .5px; text-transform: none; }
    .r-course { display: flex; align-items: center; justify-content: center; padding: 0 8mm; }
    .course { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 24px; color: #b8860b; letter-spacing: .3px; line-height: 1.25; }
    .course.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 22px; line-height: 1.4; }
    .r-desc { display: flex; align-items: flex-start; justify-content: center; padding-top: 1.5mm; }
    .desc { font-family: 'Cormorant Garamond', serif; font-size: 15px; color: #4a3c2e; line-height: 1.6; max-width: 92%; }
    .desc.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 15px; line-height: 1.75; direction: rtl; }
    .r-foot {
      display: grid;
      grid-template-columns: 80px 1fr 1fr 1fr;
      align-items: center;
      gap: 4mm;
      border-top: 1px solid rgba(201,162,39,.5);
      padding-top: 4mm;
    }
    .qr { width: 70px; height: 70px; border: 1.5px solid #c9a227; padding: 2px; background: #fff; }
    .fi { text-align: center; }
    .fv { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 700; color: #1a1410; }
    .fl { font-family: 'Cormorant Garamond', serif; font-size: 11px; font-style: italic; color: #8a7a65; margin-top: 1px; }
    .fl.ar { font-family: 'Noto Naskh Arabic', serif; font-style: normal; font-size: 12px; }
    .fi-sig { text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
    .sn { font-family: 'Great Vibes', cursive; font-size: 28px; color: #1a1410; line-height: 1.05; }
    .st { font-family: 'Cormorant Garamond', serif; font-size: 11px; color: #6b5a45; }
    .st.ar { font-family: 'Noto Naskh Arabic', serif; font-size: 12px; }
    .stamp { width: 68px; height: 68px; object-fit: contain; border-radius: 50%; opacity: .92; mix-blend-mode: multiply; }
    .stamp-fb {
      display: none; width: 68px; height: 68px; border-radius: 50%;
      border: 2.5px solid #8b2020; color: #8b2020; font-size: 9px; font-weight: 700;
      font-family: 'Cinzel', serif; align-items: center; justify-content: center;
      text-align: center; line-height: 1.15;
    }

    /* ===== أزرار الطباعة ===== */
    .print-actions {
      display: flex; gap: 15px; justify-content: center;
      margin: 20px 0 10px; flex-wrap: wrap;
    }

    /* ===== طباعة ===== */
    @media print {
      @page { size: A4 landscape; margin: 0; }
      html, body {
        margin: 0; padding: 0; background: #fff;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .no-print, .container, .modal, .header, .print-actions, .lang-label { display: none !important; }
      #certificateArea {
        display: block !important;
        position: static !important;
        width: 100% !important;
        height: auto !important;
        margin: 0; padding: 0; background: #fff;
      }
      .certificate-wrapper { display: block !important; gap: 0 !important; margin: 0; padding: 0; }
      .cert {
        width: 297mm; height: 210mm; margin: 0; box-shadow: none;
        page-break-after: always; break-after: page; page-break-inside: avoid;
      }
      .cert:last-child { page-break-after: auto; break-after: auto; }
    }

    /* ===== استجابة للشاشات الصغيرة ===== */
    @media (max-width: 1200px) {
      .container { padding: 15px; }
      .cert { width: 100%; height: auto; aspect-ratio: 297/210; }
      .ctitle { font-size: 4.4vw; }
      .tname { font-size: 4vw; }
      .tname.ar { font-size: 3.6vw; }
      .course { font-size: 2vw; }
      .wm { font-size: 7vw; }
    }
  </style>
</head>

<body>
<!-- ===== الشهادات توضع خارج الحاوية ===== -->
<div id="certificateArea" class="hidden">
  <div class="certificate-wrapper" id="certificateWrapper">
    <div id="certificateContainer"></div>
  </div>
</div>

<div class="container" id="appContainer">

  <div class="header no-print">
    <h1><i class="fa-solid fa-graduation-cap"></i> اختبار دورة إدارة المطاعم والقراءات المالية بإحترافية</h1>
    <span class="badge"><i class="fa-regular fa-clock"></i> اختبار التقييم</span>
  </div>

  <div id="quizArea">
    <div class="quiz-header">
      <span class="progress-text" id="progressLabel">1 / 30</span>
      <span style="color:#a0aec0;font-size:0.9rem;">اختر الإجابة الصحيحة</span>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div id="questionArea">
      <div class="question-text" id="questionText"></div>
      <div class="options" id="optionsContainer"></div>
      <div class="nav-buttons">
        <button class="btn btn-secondary" id="prevBtn" disabled>السابق</button>
        <button class="btn btn-primary" id="nextBtn">التالي</button>
      </div>
    </div>

    <div id="resultArea" class="result-box hidden">
      <div class="score" id="scoreDisplay">0%</div>
      <div class="message" id="resultMessage"></div>
      <div id="resultActions" class="no-print"></div>
    </div>
  </div>

  <div id="certificateActions" class="hidden no-print">
    <div class="print-actions">
      <button class="btn btn-primary" id="printBtn"><i class="fa-solid fa-print"></i> طباعة / حفظ PDF</button>
      <button class="btn btn-secondary" onclick="location.href='index.html'">
        <i class="fa-solid fa-arrow-left"></i> العودة للصفحة الرئيسية
      </button>
    </div>
  </div>
</div>

<!-- ===== نافذة إدخال الأسماء (Modal) ===== -->
<div id="nameModal" class="modal no-print hidden">
  <div class="modal-content">
    <h2><i class="fa-regular fa-pen-to-square"></i> أدخل اسمك للشهادة</h2>
    <p>سيظهر الاسم على الشهادة كما تكتبه، وستُولَّد نسختان (عربي + إنجليزي).</p>

    <label class="name-lbl" for="traineeNameEn">الاسم باللغة الإنجليزية</label>
    <input type="text" id="traineeNameEn" placeholder="Example: Ahmed Mohamed" dir="ltr" />

    <label class="name-lbl" for="traineeNameAr">الاسم باللغة العربية</label>
    <input type="text" id="traineeNameAr" placeholder="مثال: أحمد محمد" dir="rtl" />

    <button class="btn btn-success" id="generateCertBtn">
      توليد الشهادتين <i class="fa-solid fa-certificate"></i>
    </button>
    <div class="error-msg" id="nameError"></div>
  </div>
</div>

<script>
  // ---- كود الحماية (كما هو) ----
  document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); alert('تم تعطيل زر F12!'); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) {
      e.preventDefault(); alert('تم تعطيل أدوات المطور!'); return false;
    }
    if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); alert('تم تعطيل عرض المصدر!'); return false; }
  });
  document.addEventListener('contextmenu', function(e) { e.preventDefault(); alert('النقر بزر الماوس الأيمن معطل!'); return false; });
  // ---- نهاية كود الحماية ----

  // =============================================================
  // 1. بنك الأسئلة (30 سؤالاً) — بدون تغيير
  // =============================================================
  const questions = [
    { q: 'لماذا يعتبر الاعتماد على الحدس فقط في إدارة المطاعم خطراً؟', options: ['لأن الحدس غير مفيد في اتخاذ أي قرار', 'لأن الحدس يعطي شعوراً بالمشكلة لكنه لا يحدد حجمها أو سببها الحقيقي', 'لأن الحدس يعتمد على الخبرة فقط', 'لأن الحدس يبطئ عملية اتخاذ القرار'], correct: 1 },
    { q: 'ما هي الأطراف الثلاثة الرئيسية التي تقوم عليها إدارة المطاعم حسب الدورة؟', options: ['المالك، الشيف، والزبون', 'الإدارة، الموظف، والزبون', 'المطبخ، الصالة، والمخزن', 'المورد، الموظف، والمدير'], correct: 1 },
    { q: 'ما هو الدور الحقيقي لمدير المطعم حسب الدورة؟', options: ['حل جميع المشاكل اليومية بنفسه', 'العمل في المطبخ لتخفيف الضغط عن الشيف', 'التخطيط، التنظيم، والرقابة لضمان سير العمل بنظام', 'مراقبة الموظفين وتسجيل المخالفات'], correct: 2 },
    { q: 'لماذا يعتبر التخطيط والتنظيم أساسيين في المطاعم؟', options: ['لأن المطاعم بيئة متوقعة ولا تحتاج لتخطيط', 'لأن التخطيط يمنع الفوضى ويحول التشغيل من رد فعل إلى نظام مسبق', 'لأن التنظيم يزيد من ساعات العمل', 'لأن التخطيط يقلل من الحاجة للموظفين'], correct: 1 },
    { q: 'ما هي الخطوات الأساسية لاتخاذ قرار إداري تحت الضغط في المطعم؟', options: ['التسرع في الحل لتجنب خسارة الزبون', 'التوقف القصير، تحديد المشكلة بدقة، واختيار أقل قرار ضرراً', 'استشارة جميع الموظفين قبل أي قرار', 'تجاهل المشكلة حتى تهدأ الأوضاع'], correct: 1 },
    { q: 'ما هو الهدف الرئيسي من الوصفات القياسية في المطاعم؟', options: ['توحيد طريقة الطبخ فقط', 'ضبط الجودة والتكلفة وضمان ثبات المنتج', 'إرضاء الشيف وإعطائه صلاحية كاملة', 'تسهيل عملية الشراء من الموردين'], correct: 1 },

  // =============================================================
  // 2. منطق الاختبار (بدون تغيير)
  // =============================================================
  let currentIndex = 0;
  let userAnswers = new Array(questions.length).fill(null);
  let quizScore = 0;

  const questionText = document.getElementById('questionText');
  const optionsContainer = document.getElementById('optionsContainer');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const progressLabel = document.getElementById('progressLabel');
  const progressBar = document.getElementById('progressBar');
  const questionArea = document.getElementById('questionArea');
  const resultArea = document.getElementById('resultArea');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const resultMessage = document.getElementById('resultMessage');
  const resultActions = document.getElementById('resultActions');

  function renderQuestion(index) {
    const q = questions[index];
    questionText.textContent = `${index+1}. ${q.q}`;
    optionsContainer.innerHTML = '';
    q.options.forEach((opt, i) => {
      const div = document.createElement('div');
      div.className = 'option';
      if (userAnswers[index] === i) div.classList.add('selected');
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'question';
      radio.value = i;
      if (userAnswers[index] === i) radio.checked = true;
      radio.addEventListener('change', () => { selectOption(index, i); });
      const label = document.createElement('label');
      label.textContent = opt;
      div.appendChild(radio);
      div.appendChild(label);
      optionsContainer.appendChild(div);
    });
    prevBtn.disabled = index === 0;
    if (index === questions.length - 1) {
      nextBtn.textContent = 'إنهاء الاختبار';
      nextBtn.className = 'btn btn-primary';
    } else {
      nextBtn.textContent = 'التالي';
      nextBtn.className = 'btn btn-primary';
    }
    progressLabel.textContent = `${index+1} / ${questions.length}`;
    progressBar.style.width = `${((index+1) / questions.length) * 100}%`;
  }

  function selectOption(index, value) {
    userAnswers[index] = value;
    renderQuestion(currentIndex);
  }

  function goToNext() {
    if (currentIndex === questions.length - 1) { finishQuiz(); return; }
    if (userAnswers[currentIndex] === null) { alert('الرجاء اختيار إجابة قبل المتابعة.'); return; }
    currentIndex++;
    renderQuestion(currentIndex);
  }

  function goToPrev() {
    if (currentIndex > 0) { currentIndex--; renderQuestion(currentIndex); }
  }

  function finishQuiz() {
    if (userAnswers.some(ans => ans === null)) {
      alert('لا يزال هناك أسئلة لم تجب عليها. يرجى إكمال جميع الأسئلة.');
      return;
    }
    let correct = 0;
    questions.forEach((q, idx) => { if (userAnswers[idx] === q.correct) correct++; });
    const percent = Math.round((correct / questions.length) * 100);
    quizScore = percent;
    const passed = percent >= 70;

    questionArea.classList.add('hidden');
    resultArea.classList.remove('hidden');
    scoreDisplay.textContent = `${percent}% (${correct}/${questions.length})`;
    resultMessage.innerHTML = passed
      ? `<span class="pass">✅ تهانينا! لقد اجتزت الاختبار بنجاح.</span>`
      : `<span class="fail">❌ لم تجتز الاختبار. النسبة المطلوبة 70% فأكثر.</span>`;

    resultActions.innerHTML = '';
    if (passed) {
      const certBtn = document.createElement('button');
      certBtn.className = 'btn btn-success';
      certBtn.innerHTML = '<i class="fa-solid fa-certificate"></i> طلب الشهادة';
      certBtn.onclick = async function() {
        const userEmail = sessionStorage.getItem('portalUserEmail');
        if (!userEmail) { alert('يرجى تسجيل الدخول من المنصة أولاً.'); return; }
        try {
          const checkResp = await fetch(`${API_URL}?action=checkEmail&email=${encodeURIComponent(userEmail)}`);
          const checkData = await checkResp.json();
          if (checkData.status === 'existing') {
            alert('لديك شهادة سابقة بالفعل. سيتم عرضها.');
            showPreviousCertificate(checkData.certificate);
            return;
          }
        } catch (e) {}
        document.getElementById('nameModal').classList.remove('hidden');
      };
      resultActions.appendChild(certBtn);
    } else {
      const retryBtn = document.createElement('button');
      retryBtn.className = 'btn btn-warning';
      retryBtn.innerHTML = '<i class="fa-solid fa-rotate"></i> إعادة الاختبار';
      retryBtn.onclick = () => location.reload();
      resultActions.appendChild(retryBtn);
    }
  }

  prevBtn.addEventListener('click', goToPrev);
  nextBtn.addEventListener('click', goToNext);

  // دالة بناء شهادة واحدة (EN أو AR)
  function buildCert(isAr, name, dateStr, code, qr) {
    const a = isAr ? ' ar' : '';
    const title   = isAr ? 'شهادة إتمام' : 'Certificate of Completion';
    const pres    = isAr ? 'تُقدَّم بكل فخر إلى' : 'PROUDLY PRESENTED TO';
    const forT    = isAr ? 'لإتمامه بنجاح دورة' : 'FOR SUCCESSFULLY COMPLETING';
    const course  = isAr
      ? 'إدارة المطاعم والقراءات المالية بإحترافية'
      : 'Professional Restaurant Management and Financial Analysis Course';
    const desc = isAr
      ? 'مُقدَّمة من مجموعة فاروق ضمن برنامج ProServe للأغذية والمشروبات، تقديراً لإتمام متطلبات الدورة وإظهار الكفاءة في إدارة المطاعم والقراءات المالية بإحترافية.'
      : 'Presented by Farouk Grup as part of its ProServe Food & Beverage Program, in recognition of completing the course requirements and demonstrating proficiency in professional restaurant management and financial analysis.';
    const dL = isAr ? 'التاريخ' : 'Date';
    const cL = isAr ? 'رقم الشهادة' : 'Certificate no.';
    const sT = isAr ? 'مدير التدريب' : 'Training Director';

    return `<div class="cert" dir="${isAr ? 'rtl' : 'ltr'}">
      <div class="wm">FAROUK GRUP</div>

      <div class="frame-outer"></div>
      <div class="frame-mid"></div>
      <div class="frame-inner"></div>

      <div class="crn tl"></div>
      <div class="crn tr"></div>
      <div class="crn bl"></div>
      <div class="crn br"></div>

      <div class="medal">${MEDAL}</div>

      <div class="body">
        <div class="r-logo">
          <img class="logo" src="https://lh3.googleusercontent.com/d/1e6u-DPTinDJl_Q9wW3QvGgzFbXO_2sXa" alt="Logo"
               onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
          <div class="logo-fb">FAROUK GRUP</div>
          <div class="org">Farouk Grup &nbsp;|&nbsp; ProServe Food &amp; Beverage Program</div>
        </div>

        <div class="r-title"><div class="ctitle${a}">${title}</div></div>
        <div class="r-pres"><div class="pres${a}">${pres}</div></div>
        <div class="r-name"><div class="tname${a}">${name}</div></div>
        <div class="r-for"><div class="for${a}">${forT}</div></div>
        <div class="r-course"><div class="course${a}">${course}</div></div>
        <div class="r-desc"><div class="desc${a}">${desc}</div></div>

        <div class="r-foot">
          <div>${qr ? `<img class="qr" src="${qr}" alt="QR">` : ''}</div>
          <div class="fi"><div class="fv">${dateStr}</div><div class="fl${a}">${dL}</div></div>
          <div class="fi"><div class="fv">${code}</div><div class="fl${a}">${cL}</div></div>
          <div class="fi-sig">
            <div><div class="sn">Farouk Azem</div><div class="st${a}">${sT}</div></div>
            <img class="stamp" src="https://lh3.googleusercontent.com/d/1pLlZmF5a6n3YVWfu4uPP19cgMbR9P_St" alt="Stamp"
                 onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="stamp-fb">FAROUK<br>GRUP<br>★</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  // دالة توليد الشهادتين وعرضهما
  function generateCertificatesOnPage(nameEn, nameAr, certCode, dateISO) {
    const qrData = `https://training.farouk-grup.com/verify?code=${certCode}`;
    QRCode.toDataURL(qrData, { width: 160, margin: 1, color: { dark: '#1a1410', light: '#ffffff' } }, function(err, qr) {
      if (err) { console.error(err); qr = ''; }

      const d = new Date(dateISO + 'T00:00:00');
      const dateStr = d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

      const container = document.getElementById('certificateContainer');
      container.innerHTML =
        '<div class="lang-label no-print">ENGLISH VERSION</div>' +
        buildCert(false, nameEn, dateStr, certCode, qr) +
        '<div class="lang-label no-print">النسخة العربية</div>' +
        buildCert(true, nameAr, dateStr, certCode, qr);

      document.getElementById('certificateArea').classList.remove('hidden');
      document.getElementById('certificateActions').classList.remove('hidden');
    });
  }

  // عرض شهادة سابقة (يُقسّم الاسم إن كان "EN / AR")
  function showPreviousCertificate(cert) {
    if (!cert || !cert.code) return;
    let nameEn = cert.name || '';
    let nameAr = cert.name || '';
    if (nameEn.includes(' / ')) {
      const parts = nameEn.split(' / ');
      nameEn = parts[0] || '';
      nameAr = parts[1] || nameEn;
    }
    generateCertificatesOnPage(nameEn, nameAr, cert.code, cert.date);
    document.getElementById('nameModal').classList.add('hidden');
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('resultArea').classList.add('hidden');
  }

  // زر توليد الشهادتين
  document.getElementById('generateCertBtn').addEventListener('click', async function() {
    const nameEnInput = document.getElementById('traineeNameEn');
    const nameArInput = document.getElementById('traineeNameAr');
    const nameEn = nameEnInput.value.trim();
    const nameAr = nameArInput.value.trim();
    const errorDiv = document.getElementById('nameError');
    const userEmail = sessionStorage.getItem('portalUserEmail');

    if (!nameEn || !nameAr) {
      errorDiv.textContent = '❌ الرجاء إدخال الاسم بالعربية والإنجليزية.';
      return;
    }
    if (!/^[a-zA-Z\s.'\-]+$/.test(nameEn)) {
      errorDiv.textContent = '❌ الاسم الإنجليزي يجب أن يكون بحروف إنجليزية فقط.';
      return;
    }
    if (!/^[\u0600-\u06FF\s.'\-]+$/.test(nameAr)) {
      errorDiv.textContent = '❌ الاسم العربي يجب أن يكون بحروف عربية فقط.';
      return;
    }
    if (!userEmail) {
      errorDiv.textContent = '❌ انتهت الجلسة. يرجى العودة وتسجيل الدخول.';
      return;
    }
    errorDiv.textContent = '';

    const certCode = 'PS-RM-' + new Date().getFullYear() + '-' + crypto.randomUUID().split('-')[0].toUpperCase();
    const today = new Date().toISOString().slice(0, 10);
    const combinedName = nameEn + ' / ' + nameAr;

    this.disabled = true;
    this.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...';

    try {
      const url = `${API_URL}?action=save&code=${encodeURIComponent(certCode)}&name=${encodeURIComponent(combinedName)}&date=${encodeURIComponent(today)}&score=${encodeURIComponent(quizScore)}&email=${encodeURIComponent(userEmail)}`;
      const response = await fetch(url);
      const data = await response.json();

      if (data.status === 'saved') {
        generateCertificatesOnPage(nameEn, nameAr, certCode, today);
        document.getElementById('quizArea').classList.add('hidden');
        document.getElementById('resultArea').classList.add('hidden');
        document.getElementById('nameModal').classList.add('hidden');
      } else if (data.status === 'duplicate') {
        alert('هذا البريد الإلكتروني لديه شهادة سابقة. سيتم عرضها.');
        showPreviousCertificate(data.certificate);
      } else {
        throw new Error(data.message || 'فشل الحفظ');
      }
    } catch (err) {
      alert('⚠️ حدث خطأ: ' + err.message);
    } finally {
      this.disabled = false;
      this.innerHTML = 'توليد الشهادتين <i class="fa-solid fa-certificate"></i>';
    }
  });

  // Enter في أي حقل اسم = توليد
  ['traineeNameEn', 'traineeNameAr'].forEach(id => {
    document.getElementById(id).addEventListener('keypress', function(e) {
      if (e.key === 'Enter') document.getElementById('generateCertBtn').click();
    });
  });

  // زر الطباعة
  document.getElementById('printBtn').addEventListener('click', function() {
    window.print();
  });

  // =============================================================
  // 5. فحص الجلسة (بدون تغيير)
  // =============================================================
  (function initSession() {
    const userEmail = sessionStorage.getItem('portalUserEmail');
    if (!userEmail) {
      document.getElementById('quizArea').classList.add('hidden');
      const container = document.querySelector('.container');
      if (container) {
        container.innerHTML = `
          <div style="text-align:center; padding:40px; color:#d4af37;">
            <i class="fa-solid fa-lock" style="font-size:3rem;"></i>
            <h2 style="margin-top:20px;">يجب تسجيل الدخول من منصة التدريب أولاً</h2>
            <p style="color:#a0aec0;">يرجى الذهاب إلى <a href="index.html" style="color:#d4af37;">صفحة الدورة</a> وتسجيل الدخول.</p>
          </div>`;
      }
      return;
    }

    fetch(`${API_URL}?action=checkEmail&email=${encodeURIComponent(userEmail)}`)
      .then(res => res.json())
      .then(data => {
        if (data.status === 'existing') {
          document.getElementById('quizArea').classList.add('hidden');
          document.getElementById('certificateActions').classList.remove('hidden');
          const container = document.querySelector('.container');
          if (container) {
            const msgDiv = document.createElement('div');
            msgDiv.style.textAlign = 'center';
            msgDiv.style.padding = '20px';
            msgDiv.innerHTML = `
              <h3 style="color:#d4af37;">لقد حصلت مسبقاً على شهادة</h3>
              <button class="btn btn-primary" id="showPreviousCertBtn">
                <i class="fa-solid fa-certificate"></i> عرض الشهادة السابقة
              </button>`;
            container.appendChild(msgDiv);
            document.getElementById('showPreviousCertBtn').addEventListener('click', function() {
              showPreviousCertificate(data.certificate);
            });
          }
        } else {
          renderQuestion(0);
        }
      })
      .catch(err => {
        console.error('فشل التحقق:', err);
        renderQuestion(0);
      });
  })();
</script>
</body>
