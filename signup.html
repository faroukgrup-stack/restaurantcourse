<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التسجيل في دورة المطاعم | FAROUK GRUP</title>
    <meta name="description" content="سجل الآن في دورة إدارة المطاعم والقراءات المالية بإحترافية - مدة الاشتراك 5 سنوات.">
    <meta name="robots" content="noindex, follow">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* ===== نفس التصميم الذهبي ===== */
        :root {
            --gold: #b8860b;
            --gold-light: #d4b15a;
            --gold-soft: rgba(184, 134, 11, 0.08);
            --dark: #0f0f0f;
            --dark-light: #1a1a1a;
            --grey: #333;
            --light: #f5f5f5;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: radial-gradient(circle at 70% 30%, #1a1f2b, #0a0d14);
            color: #f0f4fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -120px;
            right: -120px;
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(184, 134, 11, 0.06) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 8s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -100px;
            left: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(212, 177, 90, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 10s ease-in-out infinite reverse;
        }

        @keyframes floatGlow {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(30px, -25px) scale(1.08); }
            66% { transform: translate(-20px, 20px) scale(0.94); }
        }

        .mini-nav {
            position: absolute;
            top: 20px;
            right: 30px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mini-nav .logo-sm {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--gold-light);
            font-family: 'Alexandria', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: rgba(18, 24, 36, 0.75);
            backdrop-filter: blur(12px);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid rgba(184, 134, 11, 0.25);
            transition: all 0.35s ease;
        }

        .mini-nav .logo-sm img {
            height: 28px;
            width: auto;
            object-fit: contain;
            border-radius: 4px;
        }

        .mini-nav .logo-sm:hover {
            background: rgba(184, 134, 11, 0.2);
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 4px 18px rgba(184, 134, 11, 0.3);
            transform: translateY(-2px);
        }

        .sub-card {
            text-align: center;
            max-width: 480px;
            width: 90%;
            padding: 2.8rem 2.2rem;
            background: rgba(15, 20, 30, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            border: 1px solid rgba(184, 134, 11, 0.22);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(184, 134, 11, 0.08) inset;
            position: relative;
            z-index: 2;
            transition: all 0.4s ease;
            margin: 100px 0 60px;
        }

        .sub-card:hover {
            border-color: rgba(184, 134, 11, 0.45);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(184, 134, 11, 0.06), 0 0 0 1px rgba(184, 134, 11, 0.12) inset;
        }

        .sub-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 30px;
            right: 30px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
            border-radius: 0 0 3px 3px;
            opacity: 0.8;
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 85px;
            height: 85px;
            margin: 0 auto 1.2rem;
            background: rgba(184, 134, 11, 0.1);
            border: 2px solid rgba(184, 134, 11, 0.35);
            border-radius: 50%;
            position: relative;
            animation: pulseIcon 2.5s ease-in-out infinite;
        }

        .icon-wrapper i {
            font-size: 2.4rem;
            color: var(--gold-light);
            z-index: 1;
            transition: transform 0.3s ease;
        }

        .icon-wrapper:hover i {
            transform: scale(1.15) rotate(-5deg);
        }

        @keyframes pulseIcon {
            0%, 100% { box-shadow: 0 0 0 0 rgba(184,134,11,0.25); }
            50% { box-shadow: 0 0 0 20px rgba(184,134,11,0); }
        }

        .sub-title {
            font-family: 'Cairo', 'Alexandria', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(180deg, var(--gold-light) 20%, var(--gold) 80%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.3;
            margin-bottom: 0.4rem;
            filter: drop-shadow(0 4px 8px rgba(184,134,11,0.3));
        }

        .sub-desc {
            font-size: 1rem;
            color: #bcc4d0;
            margin-bottom: 1.5rem;
        }

        .price-tag {
            background: rgba(184, 134, 11, 0.12);
            border: 1px dashed var(--gold-light);
            border-radius: 16px;
            padding: 12px 18px;
            margin: 0 auto 1.8rem;
            color: var(--gold-light);
            font-weight: 700;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: right;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #3a3f4a;
            border-radius: 12px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 12px rgba(184, 134, 11, 0.25);
        }

        .password-group {
            position: relative;
        }

        .password-group input {
            padding-left: 45px;
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px 8px;
            z-index: 2;
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .toggle-password:hover {
            color: var(--gold-light);
        }

        .domain-hint {
            font-size: 0.72rem;
            color: #8895a7;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            transition: all 0.35s ease;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            border: none;
            background: linear-gradient(135deg, var(--gold), var(--gold-light));
            color: #111;
            box-shadow: 0 6px 20px rgba(184, 134, 11, 0.45);
            width: 100%;
            margin-top: 0.8rem;
        }

        .btn:hover:not(:disabled) {
            background: linear-gradient(135deg, #111, #1f1f1f);
            color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(184, 134, 11, 0.6);
            border: 1px solid var(--gold);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .msg-box {
            margin-top: 1.5rem;
            padding: 14px;
            border-radius: 12px;
            display: none;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
        }

        .msg-box.success {
            background: rgba(75,181,67,0.15);
            color: #4bb543;
            border: 1px solid #4bb543;
        }

        .msg-box.error {
            background: rgba(255,68,68,0.15);
            color: #ff6b6b;
            border: 1px solid #ff4444;
        }

        .msg-box.exists {
            background: rgba(255,165,0,0.12);
            color: #ffa500;
            border: 1px solid #ffa500;
        }

        .login-link {
            display: inline-block;
            margin-top: 12px;
            color: var(--gold-light);
            text-decoration: none;
            border: 1px solid var(--gold-light);
            padding: 8px 22px;
            border-radius: 30px;
            transition: 0.3s;
            font-weight: 600;
        }

        .login-link:hover {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .login-alt {
            margin-top: 1.2rem;
            font-size: 0.85rem;
            color: #8895a7;
        }

        .login-alt a {
            color: var(--gold-light);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 1px dashed transparent;
        }

        .login-alt a:hover {
            color: #fff;
            border-bottom-color: var(--gold-light);
        }

        .mini-footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            font-size: 0.78rem;
            color: #667080;
            z-index: 2;
            width: 100%;
        }

        .mini-footer span {
            color: var(--gold);
            font-weight: 700;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            background: #3a3f4a;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.3s ease, background 0.3s ease;
            width: 0%;
        }

        .strength-weak { background: #ef4444; width: 33%; }
        .strength-medium { background: #f59e0b; width: 66%; }
        .strength-strong { background: #10b981; width: 100%; }

        .strength-text {
            font-size: 0.7rem;
            margin-top: 2px;
            text-align: left;
            color: #8895a7;
        }

        @media (max-width: 600px) {
            .sub-card { padding: 2rem 1.4rem; margin: 90px 0 50px; }
            .sub-title { font-size: 1.8rem; }
            .icon-wrapper { width: 70px; height: 70px; }
            .icon-wrapper i { font-size: 2rem; }
            .btn { padding: 12px 20px; font-size: 0.9rem; }
            .mini-nav { top: 10px; right: 10px; }
            .mini-nav .logo-sm { font-size: 0.8rem; padding: 6px 12px; }
            .mini-nav .logo-sm img { height: 22px; }
        }

        @media (max-width: 380px) {
            .sub-title { font-size: 1.5rem; }
            .sub-card { padding: 1.6rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="mini-nav" data-aos="fade-down" data-aos-duration="700">
        <a href="https://www.farouk-grup.com/" target="_blank" class="logo-sm">
            <img src="https://lh3.googleusercontent.com/d/1e6u-DPTinDJl_Q9wW3QvGgzFbXO_2sXa" alt="FAROUK GRUP LOGO">
            <span>مجموعة فاروق للإستشارات والأعمال</span>
        </a>
    </div>

    <div class="sub-card" data-aos="zoom-in-up" data-aos-duration="800" data-aos-delay="150">
        <div class="icon-wrapper">
            <i class="fas fa-utensils"></i>
        </div>

        <h1 class="sub-title">التسجيل في دورة</h1>
        <p class="sub-desc">إدارة المطاعم والقراءات المالية بإحترافية</p>

        <div class="price-tag">
            <i class="fas fa-infinity"></i> البريد الإلكتروني حسب بيانات الدفع
        </div>

        <form id="registerForm">
            <div class="input-group">
                <input type="text" name="fullName" id="fullName" placeholder="الاسم الكامل (اختياري)">
            </div>
            <div class="input-group">
                <input type="email" name="email" id="email" placeholder="البريد الإلكتروني" required inputmode="email" autocomplete="email">
                <div class="domain-hint">
                    <i class="fas fa-shield-alt"></i> نطاقات مسموحة: gmail.com, yahoo.com, outlook.com ...
                </div>
            </div>
            <div class="input-group password-group">
                <input type="password" name="password" id="passwordField" placeholder="كلمة المرور (6 أحرف على الأقل)" required minlength="6" autocomplete="new-password">
                <button type="button" class="toggle-password" id="togglePasswordBtn" tabindex="-1" aria-label="إظهار كلمة المرور">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
                <div class="password-strength">
                    <div class="password-strength-bar" id="passwordStrengthBar"></div>
                </div>
                <div class="strength-text" id="strengthText"></div>
            </div>

            <button type="submit" class="btn" id="registerBtn">
                <i class="fas fa-check-circle"></i> اشتراك
            </button>
        </form>

        <div id="msgBox" class="msg-box"></div>

        <div class="login-alt">
            لديك حساب؟ <a href="https://restaurantcourse.farouk-grup.com/" target="_blank">تسجيل الدخول</a>
        </div>
    </div>

    <div class="mini-footer">
        جميع الحقوق محفوظة © 2026 <span>FAROUK GRUP</span> &mdash; إسطنبول، تركيا
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 700, once: true, offset: 50 });

        // ===== زر العين لإظهار/إخفاء كلمة المرور =====
        const passwordField = document.getElementById('passwordField');
        const togglePasswordBtn = document.getElementById('togglePasswordBtn');
        const eyeIcon = document.getElementById('eyeIcon');
        const strengthBar = document.getElementById('passwordStrengthBar');
        const strengthText = document.getElementById('strengthText');

        togglePasswordBtn.addEventListener('click', function() {
            const isPassword = passwordField.type === 'password';
            passwordField.type = isPassword ? 'text' : 'password';
            eyeIcon.className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        // ===== مؤشر قوة كلمة المرور =====
        passwordField.addEventListener('input', function() {
            const val = passwordField.value;
            const bar = strengthBar;
            const txt = strengthText;

            bar.className = 'password-strength-bar';
            txt.textContent = '';

            if (val.length === 0) { bar.style.width = '0%'; return; }

            let score = 0;
            if (val.length >= 6) score++;
            if (val.length >= 10) score++;
            if (/[A-Z]/.test(val)) score++;
            if (/[a-z]/.test(val)) score++;
            if (/[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            if (score <= 2) {
                bar.classList.add('strength-weak');
                txt.textContent = 'ضعيفة – أضف أحرفاً كبيرة وأرقاماً ورموزاً';
                txt.style.color = '#ef4444';
            } else if (score <= 4) {
                bar.classList.add('strength-medium');
                txt.textContent = 'متوسطة – كلمة مرور مقبولة';
                txt.style.color = '#f59e0b';
            } else {
                bar.classList.add('strength-strong');
                txt.textContent = 'قوية – كلمة مرور ممتازة';
                txt.style.color = '#10b981';
            }
        });

        // ===== منطق التسجيل (مع تعديل طريقة الإرسال) =====
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx9XjJQBoM1iOJPhJKJUTGizQT8o9hL2ajyguCpy093f4OgZSI22vePlI4mw8ItHFAP/exec';
        const form = document.getElementById('registerForm');
        const btn = document.getElementById('registerBtn');
        const msgBox = document.getElementById('msgBox');

        // قائمة النطاقات المسموحة
        const ALLOWED_DOMAINS = [
            'gmail.com', 'yahoo.com', 'outlook.com', 'hotmail.com', 'live.com',
            'icloud.com', 'proton.me', 'protonmail.com', 'zoho.com', 'mail.com',
            'aol.com', 'yandex.com', 'msn.com', 'me.com', 'mac.com'
        ];

        function getEmailDomain(email) {
            const parts = email.split('@');
            if (parts.length !== 2) return '';
            return parts[1].toLowerCase().trim();
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            msgBox.style.display = 'none';
            msgBox.className = 'msg-box';

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = passwordField.value;

            if (!validateEmail(email)) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-exclamation-circle"></i> الرجاء إدخال بريد إلكتروني صحيح';
                return;
            }

            const domain = getEmailDomain(email);
            if (!domain || !ALLOWED_DOMAINS.includes(domain)) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-ban"></i> نطاق البريد غير مسموح. استخدم Gmail أو Yahoo أو Outlook إلخ.';
                return;
            }

            if (password.length < 6) {
                msgBox.style.display = 'block';
                msgBox.className = 'msg-box error';
                msgBox.innerHTML = '<i class="fas fa-lock"></i> كلمة المرور يجب أن تكون 6 أحرف على الأقل';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> جاري التسجيل...';

            // ✅ التعديل الأساسي: إرسال البيانات كمعاملات مباشرة
            const requestUrl = SCRIPT_URL +
                '?fn=register' +
                '&username=' + encodeURIComponent(email) +
                '&password=' + encodeURIComponent(password) +
                '&fullName=' + encodeURIComponent(fullName || '');

            fetch(requestUrl, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' },
                    mode: 'cors'
                })
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    msgBox.style.display = 'block';

                    if (data.status === 'success') {
                        msgBox.className = 'msg-box success';
                        msgBox.innerHTML = `
                            <i class="fas fa-check-circle"></i> ${data.message || 'تم التسجيل بنجاح!'}<br>
                            <a href="https://restaurantcourse.farouk-grup.com/" target="_blank" class="login-link">
                                <i class="fas fa-sign-in-alt"></i> اذهب إلى تسجيل الدخول
                            </a>
                        `;
                        form.reset();
                        passwordField.type = 'password';
                        eyeIcon.className = 'fas fa-eye';
                        strengthBar.className = 'password-strength-bar';
                        strengthBar.style.width = '0%';
                        strengthText.textContent = '';
                    } else if (data.status === 'exists') {
                        // ✅ حالة البريد مسجل مسبقاً – لا يتم تعديل أي شيء
                        msgBox.className = 'msg-box exists';
                        msgBox.innerHTML = `
                            <i class="fas fa-exclamation-triangle"></i> ${data.message || 'هذا البريد مسجل مسبقاً'}<br>
                            <a href="https://restaurantcourse.farouk-grup.com/" target="_blank" class="login-link">
                                <i class="fas fa-sign-in-alt"></i> اذهب إلى تسجيل الدخول
                            </a>
                        `;
                    } else {
                        msgBox.className = 'msg-box error';
                        msgBox.innerHTML = '<i class="fas fa-times-circle"></i> ' + (data.message || 'حدث خطأ غير معروف');
                    }
                })
                .catch(error => {
                    msgBox.style.display = 'block';
                    msgBox.className = 'msg-box error';
                    msgBox.innerHTML = '<i class="fas fa-plug"></i> تعذر الاتصال بالسيرفر. تأكد من اتصالك وحاول مجدداً.';
                    console.error('Fetch error:', error);
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-check-circle"></i> اشتراك';
                });
        });
    </script>
</body>
</html>
